quarkus:
  rest-client:
    tg-bot-api:
      url: 'https://api.telegram.org/bot${telegram.bot.token}'
    ton-api:
      url: '${ton.api.url}'
    activity-sdk-api:
      url: 'https://stage-ai-event-service.core-stage.aws.cere.io'
  kotlin-serialization:
    json:
      encode-defaults: false
      ignore-unknown-keys: true
  swagger-ui:
    always-include: true
  http:
    cors:
      ~: true
      origins: '*'
  datasource:
    db-kind: 'postgresql'
    devservices:
      port: 5432
  cache:
    caffeine:
      initial-capacity: 10000
      maximum-size: 10000
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
  hibernate-orm:
    log:
      sql: true
    database:
      generation: 'none'

activity:
  sdk:
    endpoint: 'https://stage-ai-event-service.core-stage.aws.cere.io/event/events'

"%dev":
  quarkus:
    rest-client:
      logging:
        scope: 'request-response'
        body-limit: 10000
    log:
      category:
        "org.jboss.resteasy.reactive.client.logging":
          level: 'DEBUG'

"%prod":
  quarkus:
    hibernate-orm:
      log:
        sql: false