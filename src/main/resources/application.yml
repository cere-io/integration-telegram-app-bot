ddc:
  bucket: '${DDC_BUCKET}'
  mnemonic: '${DDC_MNEMONIC}'

quarkus:
  cache:
    caffeine:
      initial-capacity: 1000
      maximum-size: 10000
  
  jackson:
    serialization-inclusion: non-null
  
  grpc:
    server:
      use-separate-server: false
    clients:
      "ddc":
        port: ${DDC_GRPC_PORT:9090}
        host: ${DDC_GRPC_HOST:178.18.148.250}
        use-quarkus-grpc-client: true
        plain-text: true

  rest-client:
    tg-bot-api:
      url: 'https://api.telegram.org/bot${telegram.bot.token}'
    tg-file-api:
      url: 'https://api.telegram.org/file/bot${telegram.bot.token}'
    compute-engine:
      url: '${compute-engine.url}'
    cere-wallet:
      url: '${cere-wallet.url}'
    rob-api:
      url: '${rob.api.url:https://api.rob.stage.cere.io/rms-node-backend}'
      headers:
        Authorization: '${ROB_API_AUTHORIZATION:b8vZS773iCvvinb9cOsJfxW6eWGiIQzl}'
    ddc-api:
      url: '${DDC_API_URL:http://178.18.148.250:9090}'

  http:
    cors:
      ~: true
      origins: '*'

telegram:
  bot:
    token: '${TELEGRAM_BOT_TOKEN}'
  webhook:
    url: '${TELEGRAM_WEBHOOK_URL}'
    token: '${TELEGRAM_WEBHOOK_SECRET_TOKEN}'
    max-connections: 40

agent-service:
  app-id: '${AGENT_SERVICE_APP_ID}'
  private-key: '${AGENT_SERVICE_PRIVATE_KEY}'
  bot-name: '${AGENT_SERVICE_BOT_NAME:stg_ddc_streaming_bot}'
  mini-app-name: '${AGENT_SERVICE_MINI_APP_NAME:viewer}'
  groups:
    some-group:
      group-id: '${AGENT_SERVICE_GROUP__SOME_GROUP__GROUP_ID}'
      org-id: '${AGENT_SERVICE_GROUP__SOME_GROUP__ORG_ID}'
      campaign-id: '${AGENT_SERVICE_GROUP__SOME_GROUP__CAMPAIGN_ID}'

"%dev":
  quarkus:
    rest-client:
      logging:
        scope: 'request-response'
        body-limit: 10000
    log:
      category:
        "org.jboss.resteasy.reactive.client.logging":
          level: 'DEBUG'
