quarkus:
  cache:
    caffeine:
      initial-capacity: 1000
      maximum-size: 10000
  rest-client:
    tg-bot-api:
      url: 'https://api.telegram.org/bot${telegram.bot.token}'
    compute-engine:
      url: '${compute-engine.url}'
    cere-wallet:
      url: '${cere-wallet.url}'
    rob-api:
      url: '${rob.api.url:https://api.rob.stage.cere.io/rms-node-backend}'
      headers:
        Authorization: '${ROB_API_AUTHORIZATION:b8vZS773iCvvinb9cOsJfxW6eWGiIQzl}'
  kotlin-serialization:
    json:
      encode-defaults: false
      ignore-unknown-keys: true
  http:
    cors:
      ~: true
      origins: '*'

agent-service:
  bot-name: '${AGENT_SERVICE_BOT_NAME:stg_ddc_streaming_bot}'
  mini-app-name: '${AGENT_SERVICE_MINI_APP_NAME:viewer}'

# Payload Notification Configuration
payload-notifications:
  # By default, payload notifications are sent to all groups the bot is subscribed to
  # Groups are discovered dynamically when bot receives messages or is added to groups
  # 
  # Override with specific chat IDs if needed:
  # target-chats:
  #   - "-1001234567890"  # Example group chat ID
  #   - "-1001234567891"  # Another group chat ID  
  #   - "123456789"       # Example private chat ID (user ID)
  #   - "987654321"       # Another private chat ID
  enabled: true

"%dev":
  quarkus:
    rest-client:
      logging:
        scope: 'request-response'
        body-limit: 10000
    log:
      category:
        "org.jboss.resteasy.reactive.client.logging":
          level: 'DEBUG'
