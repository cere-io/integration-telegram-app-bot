quarkus:
  rest-client:
    tg-bot-api:
      url: 'https://api.telegram.org/bot${telegram.bot.token}'
    ton-api:
      url: '${ton.api.url}'
    activity-sdk-api:
      url: 'https://prod-ai-event-service.core.aws.cere.io'
  kotlin-serialization:
    json:
      encode-defaults: false
      ignore-unknown-keys: true
  swagger-ui:
    always-include: true
  http:
    cors:
      ~: true
      origins: '*'
  datasource:
    db-kind: 'postgresql'
    devservices:
      port: 5432
  cache:
    caffeine:
      initial-capacity: 10000
      maximum-size: 10000
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
  hibernate-orm:
    log:
      sql: true
    database:
      generation: 'none'
  vertx:
    max-event-loop-execute-time: 10s

activity:
  sdk:
    endpoint: 'https://prod-ai-event-service.core.aws.cere.io/event/events'
  debug:
    display-in-telegram: '${DISPLAY_DEBUG_IN_TELEGRAM:false}'

event:
  app:
    id: '${EVENT_APP_ID}'
  connection:
    id: '${EVENT_CONNECTION_ID}'
  session:
    id: '${EVENT_SESSION_ID}'
  account:
    id: '${EVENT_ACCOUNT_ID}'
  signature: '${EVENT_SIGNATURE}'
  id: '${EVENT_ID}'
  type: '${EVENT_TYPE}'
  timestamp: '${EVENT_TIMESTAMP}'
  data:
    service:
      id: '${EVENT_DATA_SERVICE_ID}'
  user:
    pub:
      key: '${EVENT_USER_PUB_KEY}'

"%dev":
  quarkus:
    rest-client:
      logging:
        scope: 'request-response'
        body-limit: 10000
    log:
      category:
        "org.jboss.resteasy.reactive.client.logging":
          level: 'DEBUG'

"%prod":
  quarkus:
    hibernate-orm:
      log:
        sql: false
    vertx:
      max-event-loop-execute-time: 10s
      warning-exception-time: 10s