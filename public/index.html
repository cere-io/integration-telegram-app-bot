<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cere Activity Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            color: #333;
            background-color: #f5f5f5;
            max-width: 500px;
            margin: 0 auto;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0088cc;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        button:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cere Activity Tracker</h1>
        <p>Welcome to the Cere Activity Tracker Mini App!</p>
        <p>This app helps track and process messages from your Telegram group.</p>
        <p>Current status: <span id="status">Connected</span></p>
        
        <button id="checkHealth">Check Health</button>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setText('Close');
        tg.MainButton.show();
        
        // Handle main button click
        tg.MainButton.onClick(() => {
            tg.close();
        });
        
        // Health check functionality
        document.getElementById('checkHealth').addEventListener('click', async () => {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                alert(`System Health: ${data.status}\nUnified SDK: ${data.components.unifiedSdk.status}`);
            } catch (error) {
                alert('Error checking health: ' + error.message);
            }
        });
    </script>
</body>
</html>
